# ifran is a CLI: each `run` is one command against the shared state volume.
#
#   docker compose -f docker/docker-compose.yml build ifran
#   docker compose -f docker/docker-compose.yml run --rm ifran runs
#   docker compose -f docker/docker-compose.yml run --rm ifran run job.cyml
#
# The GPU job runner (Dockerfile.trainer) is behind the "gpu" profile:
#
#   RENDER_GID="$(getent group render | cut -d: -f3)" \
#     docker compose -f docker/docker-compose.yml --profile gpu run --rm trainer run jobs/train.cyml
services:
  ifran:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ifran:latest
    volumes:
      - ifran-data:/var/lib/ifran

  trainer:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.trainer
    image: ifran-trainer:latest
    volumes:
      - ifran-data:/var/lib/ifran
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"

volumes:
  ifran-data:
