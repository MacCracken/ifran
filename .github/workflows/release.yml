name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  packages: write   # the release image on GHCR

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned — CVE-21)

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml derives it
        # via version = "${file:VERSION}". Both must equal the pushed tag
        # (matches patra / sigil).
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        # Canonical installer — see ci.yml for rationale.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies (lock guard)
        # --locked: see ci.yml. A release builds exactly the committed lib/.
        run: cyrius deps --locked

      - name: Build (x86_64 + aarch64)
        run: |
          set -e
          NAME="${{ github.event.repository.name }}"
          mkdir -p build
          cyrius build src/main.cyr "build/$NAME"
          cyrius build --aarch64 src/main.cyr "build/$NAME-aarch64"

      - name: Check the aarch64 binary runs (qemu)
        # The CI gate above ran the whole suite as aarch64 code; this checks
        # the exact binary being released.
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-user
          qemu-aarch64 "build/${{ github.event.repository.name }}-aarch64" --version

      - name: Extract changelog
        # Pull the tagged section out of CHANGELOG.md for the release body.
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk "/^## \\[$TAG\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          [ -n "$BODY" ] || BODY="No changelog entry for $TAG."
          echo "$BODY" > /tmp/release-body.md

      - name: Source tarball + checksums
        # The source tarball + SHA256SUMS are what `cyrius deps` fetches and
        # sha256-verifies downstream — without them this project cannot be
        # consumed as a dependency. This is the release artifact, not just
        # the built binary.
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="$NAME-$TAG/" -o "$NAME-$TAG.tar.gz" HEAD
          sha256sum "$NAME-$TAG.tar.gz" build/"$NAME" build/"$NAME-aarch64" > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (pinned — CVE-21)
        with:
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          body_path: /tmp/release-body.md
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
            SHA256SUMS
            build/${{ github.event.repository.name }}
            build/${{ github.event.repository.name }}-aarch64

      - name: Stage the binaries for the image
        run: |
          NAME="${{ github.event.repository.name }}"
          mkdir -p bin/amd64 bin/arm64
          cp "build/$NAME" bin/amd64/ifran
          cp "build/$NAME-aarch64" bin/arm64/ifran

      - name: Image name and tags
        # GHCR names are lowercase. A pre-release tag (one with a '-') does not
        # move `latest`.
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ github.event.repository.name }}"
          TAGS="$IMAGE:${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) TAGS="$TAGS,$IMAGE:latest" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (pinned — CVE-21)

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0 (pinned — CVE-21)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release image (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (pinned — CVE-21)
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.image.outputs.tags }}
          push: true
