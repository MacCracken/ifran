name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies (lock guard)
        # --locked (cyrius >= 6.7.6) resolves the pinned tags, writes nothing,
        # and fails naming each difference if the committed lib/ or
        # cyrius.lock is not exactly what the tags resolve.
        run: cyrius deps --locked

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

  docker:
    name: Docker image (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned — CVE-21)

      - name: Build docker/Dockerfile
        # The image installs the cyrius.cyml pin and builds with
        # `cyrius deps --locked`, so it compiles exactly what the job above does.
        run: docker build -f docker/Dockerfile --build-arg VERSION="$(cat VERSION)" -t ifran:ci .

      - name: Run a job inside the image
        run: |
          set -e
          docker run --rm ifran:ci --version
          docker volume create ifran-ci
          docker run --rm -v ifran-ci:/var/lib/ifran --entrypoint sh ifran:ci -c \
            'printf "[job]\nname = \"smoke\"\nbin = \"/bin/echo\"\nargs = \"ok\"\nlogdir = \"runs/logs\"\n" > job.cyml'
          docker run --rm -v ifran-ci:/var/lib/ifran ifran:ci run job.cyml
          docker run --rm -v ifran-ci:/var/lib/ifran ifran:ci show 1 | grep -x ok
