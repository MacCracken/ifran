# Drop-in for GPU training jobs run through ifran-job@.service.
# Install to: /etc/systemd/system/ifran-job@.service.d/training.conf
#
# The sovereign ML siblings reach the GPU through mabda, which drives DRM
# render nodes (/dev/dri/renderD*) directly, so the job needs the render and
# video groups. It needs no vendor runtime and no Docker access.

[Service]
SupplementaryGroups=render video
# Pinned and mapped training buffers, and many open shards
LimitMEMLOCK=infinity
LimitNOFILE=65536
